name: Build KONTUR Android APK

on:
  workflow_dispatch:
  push:
    branches: [kontur-engine]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract KONTUR project
        run: unzip -q KONTUR_ENGINE_SOURCE.zip -d "$RUNNER_TEMP/kontur"
      - name: Build debug APK
        run: gradle --no-daemon -p "$RUNNER_TEMP/kontur/KONTUR_ENGINE_0_1" assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR-ENGINE-0.2-debug-apk
          path: ${{ runner.temp }}/kontur/KONTUR_ENGINE_0_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
