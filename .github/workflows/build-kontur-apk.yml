name: Build KONTUR Android APK

on:
  workflow_dispatch:
  push:
    branches: [kontur-engine]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Repair source archive and verify it
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          archive = Path("KONTUR_ENGINE_SOURCE.zip")
          data = archive.read_bytes()
          tail = base64.b64decode("AAAAAAsACwDOAwAAdjsAAAAA")
          if not data.endswith(tail):
              raise SystemExit("Unexpected source archive ending")
          missing = base64.b64decode(Path("parts/chunk3.b64").read_text().strip())
          archive.write_bytes(data[:-len(tail)] + missing + tail)
          PY
          unzip -t KONTUR_ENGINE_SOURCE.zip
      - name: Extract KONTUR project
        run: unzip -q KONTUR_ENGINE_SOURCE.zip -d "$RUNNER_TEMP/kontur"
      - name: Build debug APK
        run: gradle --no-daemon -p "$RUNNER_TEMP/kontur/KONTUR_ENGINE_0_1" assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR-ENGINE-0.2-debug-apk
          path: ${{ runner.temp }}/kontur/KONTUR_ENGINE_0_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR-ENGINE-0.2-source
          path: KONTUR_ENGINE_SOURCE.zip
          if-no-files-found: error
