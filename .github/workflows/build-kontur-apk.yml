name: Build KONTUR Android APK

on:
  workflow_dispatch:
  push:
    branches: [kontur-engine]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble source archive and verify it
        run: |
          cat parts/chunk0.b64 parts/chunk3.b64 parts/chunk4.b64 | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/KONTUR_ENGINE_SOURCE.zip"
          unzip -t "$RUNNER_TEMP/KONTUR_ENGINE_SOURCE.zip"
      - name: Extract KONTUR project
        run: unzip -q "$RUNNER_TEMP/KONTUR_ENGINE_SOURCE.zip" -d "$RUNNER_TEMP/kontur"
      - name: Fix Java renderer name collision
        run: |
          sed -i 's/new Renderer()/new KonturRenderer()/; s/class Renderer implements/class KonturRenderer implements/' "$RUNNER_TEMP/kontur/KONTUR_ENGINE_0_1/app/src/main/java/com/kontur/engine/MainActivity.java"
      - name: Package corrected source
        run: |
          cd "$RUNNER_TEMP/kontur"
          zip -qr "$RUNNER_TEMP/KONTUR_ENGINE_SOURCE_FIXED.zip" KONTUR_ENGINE_0_1
      - name: Build debug APK
        run: gradle --no-daemon -p "$RUNNER_TEMP/kontur/KONTUR_ENGINE_0_1" assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR-ENGINE-0.2-debug-apk
          path: ${{ runner.temp }}/kontur/KONTUR_ENGINE_0_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR-ENGINE-0.2-source
          path: ${{ runner.temp }}/KONTUR_ENGINE_SOURCE_FIXED.zip
          if-no-files-found: error
